<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description"
    content="Rydr — Never lose a rider again. Create rides, invite your pack and track everyone in real time." />
  <title>Rydr — Track your pack.</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="page">

    <!-- Header -->
    <header class="home-header">
      <div class="logo-wrap">
        <div class="logo-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M3 17h1.5l1.5-5h10l1.5 5H19" stroke="white" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" />
            <circle cx="7.5" cy="17.5" r="1.5" fill="white" />
            <circle cx="16.5" cy="17.5" r="1.5" fill="white" />
            <path d="M9 12l1.5-5h3L15 12" stroke="white" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <span class="logo-name">Rydr</span>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <!-- Side Drawer Menu -->
    <div id="sideMenuBackdrop" style="
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
      z-index:999; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    "></div>
    <div id="sideMenu" style="
      position:fixed; top:0; left:0; height:100%; width:78%; max-width:300px;
      background:#fff; z-index:1000;
      transform:translateX(-100%); transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);
      display:flex; flex-direction:column;
      box-shadow:4px 0 24px rgba(0,0,0,0.12);
      font-family:'Inter',sans-serif;
    ">
      <!-- Drawer Header: Profile Card -->
      <div id="sideMenuProfile" style="
        background:#0D0D0D; color:#fff;
        padding:28px 20px 22px; display:flex; flex-direction:column; gap:10px;
      ">
        <div id="sideMenuAvatar" style="
          width:52px; height:52px; border-radius:50%;
          background:#333; display:flex; align-items:center; justify-content:center;
          font-size:1.25rem; font-weight:800; color:#fff;
          border:2px solid rgba(255,255,255,0.18);
        ">?</div>
        <div>
          <div id="sideMenuName" style="font-size:1.05rem; font-weight:700; letter-spacing:-0.2px;">—</div>
          <div id="sideMenuSub" style="font-size:0.78rem; color:rgba(255,255,255,0.55); margin-top:3px;">—</div>
        </div>
      </div>

      <!-- Menu Items -->
      <div style="flex:1; padding:12px 0; overflow-y:auto;">
        <button id="menuEditProfileBtn" style="
          width:100%; display:flex; align-items:center; gap:14px;
          padding:15px 20px; background:none; border:none; cursor:pointer;
          font-family:'Inter',sans-serif; font-size:0.92rem; font-weight:500;
          color:#111; text-align:left;
        ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Edit Profile
        </button>
        <div style="height:1px; background:#F0F0F0; margin:0 20px;"></div>
        <button id="menuAboutBtn" style="
          width:100%; display:flex; align-items:center; gap:14px;
          padding:15px 20px; background:none; border:none; cursor:pointer;
          font-family:'Inter',sans-serif; font-size:0.92rem; font-weight:500;
          color:#111; text-align:left;
        ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#555" stroke-width="1.8"/>
            <path d="M12 8h.01M12 12v4" stroke="#555" stroke-width="2" stroke-linecap="round"/>
          </svg>
          About Rydr
        </button>
      </div>

      <!-- Logout at Bottom -->
      <div style="padding:12px 0 28px; border-top:1px solid #F0F0F0;">
        <button id="menuLogoutBtn" style="
          width:100%; display:flex; align-items:center; gap:14px;
          padding:15px 20px; background:none; border:none; cursor:pointer;
          font-family:'Inter',sans-serif; font-size:0.92rem; font-weight:600;
          color:#EF4444; text-align:left;
        ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="16 17 21 12 16 7" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="21" y1="12" x2="9" y2="12" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Logout
        </button>
      </div>
    </div>

    <!-- Main Landing Page Content -->
    <div id="homePageContent" style="display: none; flex-direction: column; flex: 1;">
      <!-- Hero Text -->
      <section class="home-hero">
        <h1>Never Lose<br>a Rider Again</h1>
        <p>Create rides, invite your friends<br>and track your group in real time.</p>

        <!-- Hero Image -->
        <div class="hero-img-wrap">
          <img src="assets/hero.png" alt="Group of motorcycle riders on a mountain road" />
          <div class="hero-img-overlay"></div>
        </div>
      </section>

      <!-- CTA Buttons -->
      <div class="btn-group">
        <button class="btn btn-black" id="createRideBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.8" />
            <path d="M12 8v8M8 12h8" stroke="white" stroke-width="2" stroke-linecap="round" />
          </svg>
          Create Ride
        </button>
        <button class="btn btn-outline" id="joinRideBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4" stroke="#0D0D0D" stroke-width="1.8" stroke-linecap="round" />
            <polyline points="10 17 15 12 10 7" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <line x1="15" y1="12" x2="3" y2="12" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span id="joinBtnText">Join Ride</span>
        </button>
      </div>

      <!-- Tagline -->
      <p class="home-tagline">Ride together. Stay together.</p>
    </div>

    <!-- Profile Creation Form -->
    <div id="profileCreationForm" style="display: none; padding: 24px 20px; flex-direction: column; flex: 1;">
      <h2 style="font-size: 1.45rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.4px;">Create Rider Profile</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 24px;">Please enter your details to get started.</p>

      <div style="display: flex; flex-direction: column; gap: 14px; flex: 1;">
        <!-- First Name -->
        <div class="form-field" style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 8px 0;">
          <span style="font-size: 1.1rem; width: 20px; text-align: center; color: var(--text-muted);">👤</span>
          <div style="flex: 1;">
            <label class="field-label" style="font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px;">First Name</label>
            <input class="field-input" type="text" id="profileFirstName" placeholder="e.g. Akshay" maxlength="25" style="width: 100%; border: none; outline: none; background: none; font-size: 0.95rem; font-weight: 500; padding: 4px 0;" />
          </div>
        </div>

        <!-- Last Name -->
        <div class="form-field" style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 8px 0;">
          <span style="font-size: 1.1rem; width: 20px; text-align: center; color: var(--text-muted);">👤</span>
          <div style="flex: 1;">
            <label class="field-label" style="font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px;">Last Name</label>
            <input class="field-input" type="text" id="profileLastName" placeholder="e.g. Shetty" maxlength="25" style="width: 100%; border: none; outline: none; background: none; font-size: 0.95rem; font-weight: 500; padding: 4px 0;" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-field" style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 8px 0;">
          <span style="font-size: 1.1rem; width: 20px; text-align: center; color: var(--text-muted);">✉️</span>
          <div style="flex: 1;">
            <label class="field-label" style="font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px;">Email Address</label>
            <input class="field-input" type="email" id="profileEmail" placeholder="e.g. akshay@example.com" style="width: 100%; border: none; outline: none; background: none; font-size: 0.95rem; font-weight: 500; padding: 4px 0;" />
          </div>
        </div>

        <!-- Contact -->
        <div class="form-field" style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 8px 0;">
          <span style="font-size: 1.1rem; width: 20px; text-align: center; color: var(--text-muted);">📞</span>
          <div style="flex: 1;">
            <label class="field-label" style="font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px;">Contact Number</label>
            <input class="field-input" type="tel" id="profileContact" placeholder="e.g. 9876543210" style="width: 100%; border: none; outline: none; background: none; font-size: 0.95rem; font-weight: 500; padding: 4px 0;" />
          </div>
        </div>

        <!-- Blood Group -->
        <div class="form-field" style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 8px 0;">
          <span style="font-size: 1.1rem; width: 20px; text-align: center; color: var(--text-muted);">🩸</span>
          <div style="flex: 1; position: relative;">
            <label class="field-label" style="font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px;">Blood Group</label>
            <select class="field-input" id="profileBloodGroup" style="width: 100%; border: none; outline: none; background: none; font-size: 0.95rem; font-weight: 500; padding: 4px 0; -webkit-appearance: none; -moz-appearance: none; appearance: none; color: var(--text-primary);">
              <option value="" disabled selected style="color: var(--text-muted);">Select blood group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn btn-black" id="saveProfileBtn" style="margin-top: 24px; margin-bottom: 12px;">
        Save Profile
      </button>
    </div>

  </div><!-- /.page -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => { });
    }
  </script>

  <script>
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    const homeContent = document.getElementById('homePageContent');
    const profileForm = document.getElementById('profileCreationForm');
    const joinBtnText = document.getElementById('joinBtnText');

    function checkProfile() {
      const profileStr = localStorage.getItem('rydr_rider_profile');
      if (profileStr) {
        try {
          const profile = JSON.parse(profileStr);
          if (profile.firstName && profile.lastName) {
            profileForm.style.display = 'none';
            homeContent.style.display = 'flex';
            if (joinBtnText) joinBtnText.textContent = 'Ride Again';
            return;
          }
        } catch (e) {}
      }
      profileForm.style.display = 'flex';
      homeContent.style.display = 'none';
    }

    // Save profile logic
    document.getElementById('saveProfileBtn').addEventListener('click', () => {
      const firstName = document.getElementById('profileFirstName').value.trim();
      const lastName = document.getElementById('profileLastName').value.trim();
      const email = document.getElementById('profileEmail').value.trim();
      const contact = document.getElementById('profileContact').value.trim();
      const bloodGroup = document.getElementById('profileBloodGroup').value;

      if (!firstName) { showToast('Please enter your first name', 'error'); return; }
      if (!lastName) { showToast('Please enter your last name', 'error'); return; }
      if (!email) { showToast('Please enter your email', 'error'); return; }
      if (!contact) { showToast('Please enter your contact number', 'error'); return; }
      if (!bloodGroup) { showToast('Please select your blood group', 'error'); return; }

      const profile = { firstName, lastName, email, contact, bloodGroup };
      localStorage.setItem('rydr_rider_profile', JSON.stringify(profile));
      showToast('Profile saved successfully!', 'success');
      
      setTimeout(() => {
        checkProfile();
      }, 800);
    });

    document.getElementById('createRideBtn').addEventListener('click', () => {
      window.location.href = 'create-ride.html';
    });
    document.getElementById('joinRideBtn').addEventListener('click', () => {
      window.location.href = 'join-ride.html';
    });

    // Check URL for ride invite
    const params = new URLSearchParams(window.location.search);
    const rideParam = params.get('ride') || params.get('join');
    if (rideParam) {
      window.location.href = `join-ride.html?rideId=${rideParam}`;
    }

    // ===== HAMBURGER MENU =====
    const sideMenu = document.getElementById('sideMenu');
    const sideMenuBackdrop = document.getElementById('sideMenuBackdrop');

    function openSideMenu() {
      // Populate profile info
      try {
        const profileStr = localStorage.getItem('rydr_rider_profile');
        const profile = profileStr ? JSON.parse(profileStr) : null;
        const avatarEl = document.getElementById('sideMenuAvatar');
        const nameEl = document.getElementById('sideMenuName');
        const subEl = document.getElementById('sideMenuSub');
        if (profile && profile.firstName) {
          const initials = (profile.firstName[0] + (profile.lastName ? profile.lastName[0] : '')).toUpperCase();
          const fullName = `${profile.firstName} ${profile.lastName || ''}`.trim();
          if (avatarEl) avatarEl.textContent = initials;
          if (nameEl) nameEl.textContent = fullName;
          if (subEl) subEl.textContent = [profile.bloodGroup ? '🩸 ' + profile.bloodGroup : '', profile.contact || ''].filter(Boolean).join('  ·  ') || profile.email || '—';
        } else {
          if (avatarEl) avatarEl.textContent = '?';
          if (nameEl) nameEl.textContent = 'No Profile';
          if (subEl) subEl.textContent = 'Create your profile to get started';
        }
      } catch {}
      sideMenuBackdrop.style.display = 'block';
      sideMenu.style.transform = 'translateX(0)';
    }

    function closeSideMenu() {
      sideMenu.style.transform = 'translateX(-100%)';
      setTimeout(() => { sideMenuBackdrop.style.display = 'none'; }, 280);
    }

    document.getElementById('menuBtn').addEventListener('click', () => openSideMenu());
    sideMenuBackdrop.addEventListener('click', () => closeSideMenu());

    // Edit Profile — scroll to form
    document.getElementById('menuEditProfileBtn').addEventListener('click', () => {
      closeSideMenu();
      // Clear localStorage profile so form shows
      const confirmed = window.confirm('Edit your profile? This will take you back to the profile form.');
      if (!confirmed) return;
      localStorage.removeItem('rydr_rider_profile');
      setTimeout(() => checkProfile(), 350);
    });

    // About
    document.getElementById('menuAboutBtn').addEventListener('click', () => {
      closeSideMenu();
      showToast('🏍️ Rydr v2 — Ride together, stay together.', '');
    });

    // Logout
    document.getElementById('menuLogoutBtn').addEventListener('click', () => {
      closeSideMenu();
      const confirmed = window.confirm('Are you sure you want to logout? Your profile data will be cleared.');
      if (!confirmed) return;
      localStorage.removeItem('rydr_rider_profile');
      localStorage.removeItem('rydr_rider');
      localStorage.removeItem('ridesync_rider');
      sessionStorage.clear();
      showToast('Logged out 👋', 'success');
      setTimeout(() => checkProfile(), 800);
    });

    // Initial check
    checkProfile();
  </script>
</body>

</html>
