<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="Rydr — Join a Ride" />
  <title>Rydr — Join Ride</title>
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="page">

    <!-- Nav Bar -->
    <nav class="nav-bar">
      <button class="nav-back" id="backBtn" aria-label="Go back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M19 12H5M5 12l7-7M5 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <span class="nav-title">Join Ride</span>
      <span class="nav-spacer"></span>
    </nav>

    <!-- Hero Image -->
    <div class="join-hero-img">
      <img src="assets/join-hero.png" alt="Two motorcycle riders on the road" />
    </div>

    <!-- Subtitle -->
    <p class="join-subtitle">Enter your details to join the ride</p>

    <!-- Form -->
    <div class="join-form">

      <!-- Ride ID (pre-filled if from link) -->
      <div class="join-field" id="rideIdField">
        <label for="joinRideId">Ride ID or Link</label>
        <input type="text" id="joinRideId" placeholder="e.g. RF-250525-001" autocomplete="off" />
      </div>

      <!-- Your Name -->
      <div class="join-field">
        <label for="joinName">Your Name</label>
        <input type="text" id="joinName" placeholder="e.g. Akshay" maxlength="25" autocomplete="off" />
      </div>

      <!-- Bike Name (Optional) -->
      <div class="join-field">
        <label for="bikeName">Bike Name (Optional)</label>
        <input type="text" id="bikeName" placeholder="e.g. Kawasaki Z900" maxlength="40" autocomplete="off" />
      </div>

    </div>

    <!-- Sticky CTA -->
    <div class="sticky-cta">
      <button class="btn btn-black" id="joinBtn">
        Join Ride
      </button>
    </div>

    <!-- Waiting status (shown after joining but before ride starts) -->
    <div class="waiting-status" id="waitingStatus" style="display:none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#ABABAB" stroke-width="1.8" />
        <path d="M12 7v5l3 3" stroke="#ABABAB" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      <div class="waiting-status-text">
        <strong>Waiting for the ride to start...</strong>
        <span>You will be notified once the ride begins.</span>
      </div>
    </div>

  </div><!-- /.page -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function generateUserId() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function unicodeToUrlBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // Pre-fill Ride ID from URL
    const params = new URLSearchParams(window.location.search);
    const rideIdParam = params.get('rideId');
    if (rideIdParam) {
      document.getElementById('joinRideId').value = rideIdParam;
    }

    // Pre-fill Name from profile
    const profileStr = localStorage.getItem('rydr_rider_profile');
    const profile = profileStr ? JSON.parse(profileStr) : null;
    if (profile && profile.firstName && profile.lastName) {
      document.getElementById('joinName').value = `${profile.firstName} ${profile.lastName}`;
    }

    // Back button
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Rider color palette
    const colors = ['#6366F1', '#EC4899', '#F59E0B', '#22C55E', '#0EA5E9', '#F97316', '#8B5CF6', '#EF4444'];
    const randomColor = colors[Math.floor(Math.random() * colors.length)];

    // Join Ride
    document.getElementById('joinBtn').addEventListener('click', async () => {
      const rawId = document.getElementById('joinRideId').value.trim();
      const name = document.getElementById('joinName').value.trim();
      const bike = document.getElementById('bikeName').value.trim();

      if (!rawId) { showToast('Please enter a Ride ID or link', 'error'); return; }
      if (!name) { showToast('Please enter your name', 'error'); return; }

      // Extract ride ID from URL if needed
      let rideId = rawId;
      try {
        const u = new URL(rawId);
        rideId = u.searchParams.get('rideId') || u.searchParams.get('ride') || rawId;
      } catch { }
      rideId = rideId.trim().toUpperCase();

      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.textContent = 'Joining…';

      try {
        // Verify ride exists
        const rideDoc = await getDoc(doc(db, 'rides', rideId));
        if (!rideDoc.exists()) {
          showToast('Ride not found. Check the ID.', 'error');
          btn.disabled = false;
          btn.textContent = 'Join Ride';
          return;
        }

        const rideData = rideDoc.data();
        const riderId = generateUserId();

        const session = {
          riderId, rideId,
          name, bike: bike || null,
          color: randomColor,
          isHost: false,
          rideTitle: rideData.title || rideId,
          email: profile ? profile.email : null,
          contact: profile ? profile.contact : null,
          bloodGroup: profile ? profile.bloodGroup : null,
          startLocation: rideData.startLocationName || null,
          startLocationCoords: rideData.startLat ? { lat: rideData.startLat, lng: rideData.startLng } : null,
          destination: rideData.destinationName ? {
            name: rideData.destinationName,
            lat: rideData.destinationLat,
            lng: rideData.destinationLng
          } : null
        };

        sessionStorage.setItem('rydr_session', JSON.stringify(session));
        localStorage.setItem('rydr_rider', JSON.stringify(session));

        showToast('Joining ride… 🏍️', 'success');
        setTimeout(() => {
          const encoded = unicodeToUrlBase64(JSON.stringify(session));
          window.location.href = `ride.html?s=${encoded}`;
        }, 700);
      } catch (err) {
        console.error(err);
        showToast('Failed to join. Try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Join Ride';
      }
    });

    // Enter key support
    document.getElementById('joinName').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('bikeName').focus();
    });
    document.getElementById('bikeName').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('joinBtn').click();
    });
  </script>
</body>

</html>
