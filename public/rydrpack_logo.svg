<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant orange gradient matching RydrPack visual brand -->
    <linearGradient id="logoOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA500" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
  </defs>

  <!-- Helmet contour group with premium vector styling -->
  <g fill="none" stroke="url(#logoOrangeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main helmet outer curve with rear point/spoiler at (20, 50) -->
    <path d="M 50,150 
             C 25,145 15,115 25,90 
             C 10,75 12,65 30,52 
             C 50,22 90,15 130,22
             C 170,30 185,65 180,100
             C 180,115 175,130 165,145
             C 155,160 140,170 120,175" />

    <!-- Visor front cut-out shape -->
    <path d="M 120,70 L 175,70 C 180,85 178,100 170,112 L 130,112 C 122,112 118,102 118,92 Z" />

    <!-- Bottom sweep line with arrowhead pointing right -->
    <path d="M 40,140 C 45,158 75,165 110,165 L 140,165" />
    <path d="M 130,157 L 142,165 L 130,173" stroke-width="6" />

    <!-- VISOR NETWORK GRAPH NODES -->
    <!-- Connection lines -->
    <line x1="90" y1="58" x2="120" y2="60" />
    <line x1="90" y1="58" x2="62" y2="92" />
    <line x1="62" y1="92" x2="90" y2="120" />
    <line x1="90" y1="120" x2="120" y2="92" />
    <line x1="120" y1="92" x2="90" y2="58" />
  </g>

  <!-- Network Nodes circles -->
  <g fill="#121214" stroke="url(#logoOrangeGrad)" stroke-width="4.5">
    <circle cx="90" cy="58" r="9" />
    <circle cx="120" cy="60" r="7" />
    <circle cx="62" cy="92" r="9" />
    <circle cx="90" cy="120" r="9" />
    <circle cx="120" cy="92" r="8" />
  </g>

  <!-- RP Letters at the bottom -->
  <text x="30" y="195" 
        fill="url(#logoOrangeGrad)" 
        font-family="'Outfit', 'Inter', -apple-system, sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="34" 
        letter-spacing="-1.5">RP</text>
</svg>
